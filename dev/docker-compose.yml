# Hilfsdienste für die lokale Entwicklung: Datenbank, Redis, Keycloak.
# Backend und Frontend laufen direkt auf dem Rechner (siehe README.md).
# NICHT für den Echtbetrieb verwenden.
name: scout-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  keycloak:
    # Gleiche Version wie beim Verband (dpvonline/azure-docker, Stand Juli 2026)
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev --http-port=8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: scout
      KC_DB_PASSWORD: scout
    ports:
      - "8180:8180"
    depends_on:
      - postgres

volumes:
  pgdata:
